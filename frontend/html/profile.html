    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
</head>
<body data-auth-page="profile" data-requires-auth>
    <header>
        <h1>알고리즘 실행 시각화</h1>
        <p class="site-subtitle">모바일 웹 수업 프로젝트 · 개발 중</p>
    </header>

    <nav aria-label="주 메뉴">
        <ul>
            <li><a href="index.html">홈</a></li>
            <li><a href="visualizer.html">시각화</a></li>
            <li><a href="board.html">게시판</a></li>

    <main id="main">
        <section>
            <h2>내 정보</h2>
            <noscript><p class="notice">회원 기능은 JavaScript가 필요합니다. 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
            <p id="profile-message" class="auth-message" role="status" data-auth-status hidden></p>
            <p id="profile-login-required" hidden>로그인이 필요합니다. <a href="login.html?next=/web/html/profile.html">로그인</a></p>
            <form id="profile-form" method="post" action="profile.html" novalidate hidden>
                <p>이메일: <strong id="profile-email"></strong></p>
                <p id="profile-intro"></p>
                <label for="nickname">닉네임 (2~20자)</label>
                <input type="text" id="nickname" name="nickname" autocomplete="nickname" required maxlength="40">
                <button type="submit">저장</button>
            </form>
        </section>
    </main>

    <footer>
