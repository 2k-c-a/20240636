[project]
name = "algorithm-visualizer-web"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "supabase==2.32.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

# HTML responses need the application's dynamic Supabase CSP headers.
[tool.vercel.fastapi.static]
cdn = false
